# Writing this harness's configuration

## The file

| | |
|---|---|
| path | `~/.codex/config.toml` |
| grammar | **toml** |
| comments | **parse** |
| home moved by | `CODEX_HOME` |

TOML, so `#` comments are part of the grammar. No JSON schema is possible for it and none is expected; the setups are checked by parsing instead.

## The same question on the other harnesses

| harness | file | grammar | comments |
|---|---|---|---|
| `antigravity` | `antigravity-cli/settings.json` | json | no |
| `claude` | `settings.json` | json | no |
| **this one** | `config.toml` | toml | yes |
| `cursor` | `cli-config.json` | json | no |
| `grok` | `config.toml` | toml | yes |
| `opencode` | `opencode.json` | jsonc | yes |
| `pi` | `settings.json` | json | no |

**A comment is not a stylistic choice.** In a strict-JSON file a `//` is
a parse error, and the product does not start rather than starting
without your setting. Two of the seven take comments; the rest do not,
and one of those takes them at two spellings of the same file.

## Before you write one

- **Ask what the product resolved, not what the file says.** Write the
  key, start the product, and read its own answer back. A key the
  product does not know is usually accepted in silence -- which reads
  as configured and does nothing.
- **Put an invented key beside yours.** If the product complains about
  neither, the run discriminates nothing and *the key survived* says
  nothing at all. That control is what separates a file that is parsed
  from a file that is merely read.
- **A value here may not be the effective one.** Where an administrator
  layer exists it clamps everything below it, so a setup can install,
  verify and restore cleanly on a managed machine and change nothing.
  the `nddev-surfaces` prompt, and `codex-setup-system provider-info`, records which layers this product has and
  what was searched for the ones it does not.


# Writing this harness's instruction file

## Where it goes

`~/.codex/AGENTS.md`

Decided by: https://learn.chatgpt.com/docs/agent-configuration/agents-md

## What the record says about it

**Searched in the product's own pinned bytes on 2026-08-29 and not found, which argues nothing either way.** Fixed-string, anchored to this product's configuration home -- the bare leaf name is in every one of these binaries and proves nothing, so only the anchored form counts. An invented path was searched in the same run and was also absent, so the search discriminates.

This row stays `page` because **a path built by joining a directory to a name at runtime never appears as a literal**, and that is the shape of every remaining one. Moving it off `page` needs the product run against a target and asked what it resolved, not a deeper grep.

## Where the other harnesses keep theirs

| harness | path | shape |
|---|---|---|
| `antigravity` | `config/rules` | directory |
| `claude` | `CLAUDE.md` | file |
| **this one** | `AGENTS.md` | file |
| `cursor` | `rules` | directory |
| `grok` | `AGENTS.md` | file |
| `opencode` | `AGENTS.md` | file |
| `pi` | `AGENTS.md` | file |

**They are not interchangeable, and the difference is not only the
name.** One of the seven takes a *directory* of rules rather than a
single document, so a file moved between the two is not a rename.

**Some products read a neighbour's.** the `nddev-surfaces` prompt, and `codex-setup-system provider-info`, records
every such cross-read this estate has measured, on the declined rows:
a file written for one product can change what a second one sees, and
removing a setup can change what a third one sees. That is a property
of the products, not of this program, and it is the reason the declined
list is worth reading before writing here.

## Before you write one

- **This file is the floor, not the ceiling.** A repository's own
  instructions sit above it; write what is true everywhere and leave
  the rest to the project.
- **Read it back where the product reads it**, not where the install
  put it. Several of these products resolve a home through an override
  chain, and the two are not always the same directory.


# The second target this harness owns

## `target_scope: user_root`, rooted at `~/.agents`

**`~/.agents` is not this product's configuration home.** It is a
different target, reached by a consumer naming the scope on the
request, and every path below is relative to that root rather than
to the home -- writing the root into the path again would nest it
twice, which is a mistake this estate has made and shipped.

| path | routes | decided by | exercised by |
|---|---|---|---|
| `skills` | skill | <https://learn.chatgpt.com/docs/build-skills> | **ran it** |
### `skills`, as measured

The documented user-level skills directory is $HOME/.agents/skills. Relative to this scope's own root it is `skills`, not `.agents/skills` -- the root is what the scope names, and writing it into the path again would put the skills at ~/.agents/.agents/skills. Codex also reads $CODEX_HOME/skills, measured, which is declined in the global block and for reasons recorded there.

**Run, not read.** The pinned `codex-0.150.1-linux-x64.tgz` was fetched, its digest checked against the artifact table, and the binary driven with `debug prompt-input` against a temporary `HOME` and `CODEX_HOME`. A `SKILL.md` at `$HOME/.agents/skills/nddev-user-root-probe/` appears in the rendered `<skills_instructions>` list with that file locator, beside the product's own five bundled skills.

**With a control, because a positive without one says nothing.** A second skill was placed at `$HOME/.agents-not-a-root/skills/` -- a sibling root no page names -- and it is absent from the same listing. So the product is reading the documented root rather than scanning `$HOME` broadly, which is the reading a bare positive could not distinguish.


**A setup cannot carry one of these.** A setup is installed into one
target and its payload is relative to that target, so a component
for this scope is installed by the consumer against that root -- not
by a setup aimed at the configuration home. If you are looking for
where to put one by hand, it is the path above joined to the root
above, and nowhere under the home.

**The root is shared, and that changes what removal means.** Several
products read it. Under this scope `remove`, the backup and a
restore act on the files this provider recorded writing rather than
on the directory whole, so a neighbour's files are never captured
into a slot here and never reverted out of one.

