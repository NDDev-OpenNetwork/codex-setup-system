| field | `claude` | `codex` | `pi` | `opencode` | `antigravity` |
|---|---|---|---|---|---|
| `description` | yes | yes | yes | yes | yes |
| `argument-hint` | yes | yes | yes | — | — |
| `agent` | — | — | — | yes | — |
| `model` | — | — | — | yes | — |
| `subtask` | — | — | — | yes | — |
