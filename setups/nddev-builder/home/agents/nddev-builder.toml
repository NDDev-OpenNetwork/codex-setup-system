## Hook

**Where it goes**: `~/.codex/hooks.json`

**Decided by**: https://learn.chatgpt.com/docs/hooks

**How it runs**: Codex fires the hook on the event it is registered under.

## Frontmatter

| field | required | what it does |
|---|---|---|
| `matcher` | no | Regex against the tool name. Optional. |
| `type` | no | `command` or `mcp_tool`. |
| `command` | no | Shell invocation, for `type: command`. |
| `commandWindows` | no | Windows override. |
| `timeout` | no | Seconds. Default 600; `SessionEnd` defaults to 1. |
| `statusMessage` | no | Text shown while it runs. |
| `additionalContextLimit` | no | Token threshold, ~2500 by default. |
| `async` | no | Run in the background. Default false. |
| `server` | no | MCP server name, for `type: mcp_tool`. |
| `tool` | no | Tool on that server. |
| `input` | no | Argument templates with `${field.nested}` expansion. |

## Events

`SessionStart`  `SessionEnd`  `SubagentStart`  `SubagentStop`  `PreToolUse`  `PostToolUse`  `PermissionRequest`  `PreCompact`  `PostCompact`  `UserPromptSubmit`  `Stop`

## What bites

- **Hooks are trusted by hash, and this changes what an install means.** The vendor is explicit: *"Before a non-managed hook can run, Codex requires you to review and trust the exact hook definition. Codex records trust against the hook's current hash, so new or changed hooks are marked for review and skipped until trusted."* So writing this file -- by an install, or by a restore putting back a file that was trusted before -- leaves the hooks inert until a person runs `/hooks` and trusts them again. A setup that carries hooks cannot promise they are active, only that the file is in place. Say so where a reader will see it.
- This surface is a single JSON **file**, not a directory of them. The other harness in this estate that routes hooks does the opposite; a hook moved between the two has to be repackaged.

