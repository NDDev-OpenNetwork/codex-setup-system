What this harness routes, and how to write one of each, is below. For
what it owns, ask the binary: `codex-setup-system provider-info`.

# Writing a component for this harness

## Agent

**Where it goes**: ``[agents.<name>]` in `config.toml`, pointing at a TOML layer`

**Decided by**: https://learn.chatgpt.com/docs/config-file/config-reference; routing measured against the pinned 0.149.1 binary

**How it runs**: Codex spawns the role by the name in its stanza.

## Declaration

| key | required | what it does |
|---|---|---|
| `description` | **yes** | Role guidance shown to Codex when choosing and spawning that agent type. |
| `config_file` | no | Path to a TOML config layer for that role. Relative paths resolve from the config file that declares the role, not from the home. |

## What bites

- **A file in `agents/` is not an agent.** This is the one place in this estate where the obvious thing does not work, and it fails silently. A role is two artifacts: a stanza in the settings file and the layer it points at. Measured by running the product against a temporary home -- a bad pointer is reported, *"Ignoring malformed agent role definition: agents.broken-role.config_file must point to an existing file at ..."*, while an `agents/<name>.md` sitting beside it was loaded by nothing and complained about by nothing.
- That is why `agents` routes no kind, and the reason is arity rather than behaviour. A component of one kind is one thing installed in one namespace, and this route needs two files written together -- there is no way to say "and also add a stanza to the settings file" in the kind model. That holds even if the product started scanning the directory tomorrow: the role would still be a stanza plus the layer it points at. The measured behaviour above is the weaker half of the reason, and it read as the stronger one for as long as it was the only half written down.
- The layer is ordinary configuration, so it carries `developer_instructions` for the prompt rather than a Markdown body. This toolkit's own role is written exactly that way; read `agents/nddev-builder.toml` and the stanza in `config.toml` together as the worked example.

## Before you ship one

- **The surface is declared, so the component is a promise.** Every kind   this provider declares is a promise of a rollback. A component written   to a path the declaration does not carry is installed by nobody and   removed by nobody.
- **Name it once.** Where the product derives identity from the directory   or the filename, the frontmatter `name` is either redundant or a second   place to be wrong. Keep them equal.
- **Read it back.** After an install, look at the file where the product   reads it, not at the step that put it there.

## Command

**Where it goes**: `~/.codex/prompts/<name>.md`

**Decided by**: https://learn.chatgpt.com/docs/custom-prompts

**How it runs**: `/prompts:<name> KEY=value`, quoting values that contain spaces.

## Frontmatter

| field | required | what it does |
|---|---|---|
| `description` | no | Shown in the slash command menu. |
| `argument-hint` | no | Expected parameters, e.g. `[FILES=<paths>]`. |

## What bites

- **Only top-level files are scanned. Subdirectories are ignored.** A `references/` directory next to a prompt is not read, which is why this harness's toolkit carries no reference files.
- Substitution is `$1`..`$9`, `$ARGUMENTS` for all of them, uppercase named placeholders like `$FILE`, and `$$` for a literal dollar sign.
- **The vendor marks this surface deprecated in favour of skills.** It is still what this harness reads, and this provider still declares it, because the replacement does not route here: see `surfaces` for where a skill goes for this product.

